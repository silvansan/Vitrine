name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r server/requirements.txt
      - run: python manage.py test guestmedia
        working-directory: server
      - name: Build and push image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vitrine-server
          TAG=latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG=${GITHUB_REF#refs/tags/}; fi
          docker build -t $IMAGE:$TAG server
          docker push $IMAGE:$TAG

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Build Windows binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION=dev-${GITHUB_SHA::7}
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X github.com/silvansan/vitrine/agent/internal/app.Version=$VERSION" -o dist/vitrine-agent.exe ./cmd/vitrine-agent
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H windowsgui" -o dist/vitrine-tray.exe ./cmd/vitrine-tray
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/vitrine-fakevmix.exe ./cmd/vitrine-fakevmix
          cp config.example.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-agent-windows
          path: agent/dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/*

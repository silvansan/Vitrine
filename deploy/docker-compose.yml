# Vitrine server stack for Portainer.
#
# Portainer: Stacks > Add stack, either Repository (URL https://github.com/silvansan/Vitrine,
# compose path deploy/docker-compose.yml) or Web editor (paste this file), and add the
# variables from .env.example (only POSTGRES_PASSWORD is required; Telegram, email and
# backups are set later in /manage/ → Settings).
# Images are pulled from ghcr.io (built by GitHub Actions on every push to main), so Portainer
# never builds anything. nginx's config is baked into its image.
#
# Nginx Proxy Manager forwards your public guest subdomain to vitrine-nginx:80 on the
# "proxy" network. The agent on the vMix PC talks to the same nginx over Tailscale on
# port ${VITRINE_TAILSCALE_PORT:-8080} of this server.
#
# Updating: Actions → release → Run workflow, wait for it to finish, then Portainer → this
# stack → Pull and redeploy (tick "Re-pull image and redeploy"). Migrations run on start.
# Then update the agent on each vMix PC (docs/server.md → Updating).

# Docker keeps container logs forever by default, which can fill the disk (and then Postgres
# stops). Each Vitrine container keeps at most 3 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ghcr.io/silvansan/vitrine-server:latest
    command: web
    restart: unless-stopped
    logging: *logging
    env_file: stack.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      VITRINE_X_ACCEL: "true"
    volumes:
      - vitrine-data:/data
    depends_on: [db, redis]
    networks: [internal]

  worker:
    image: ghcr.io/silvansan/vitrine-server:latest
    command: worker
    restart: unless-stopped
    logging: *logging
    env_file: stack.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - vitrine-data:/data
    depends_on: [db, redis]
    networks: [internal]

  scheduler:
    # Alerts to staff, nightly backup, trash cleanup.
    image: ghcr.io/silvansan/vitrine-server:latest
    command: scheduler
    restart: unless-stopped
    logging: *logging
    env_file: stack.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - vitrine-data:/data
      # Backup to a folder on this server (USB disk, NAS mounted on the host): uncomment,
      # then choose "Folder on the server" with /backup in /manage/ → Settings → Backups.
      # Cloud, FTP, SFTP and SMB targets need nothing here: set them up in Settings.
      # - /mnt/nas/vitrine-backup:/backup
    depends_on: [db, redis]
    networks: [internal]

  nginx:
    image: ghcr.io/silvansan/vitrine-nginx:latest
    container_name: vitrine-nginx
    restart: unless-stopped
    logging: *logging
    volumes:
      - vitrine-data:/data:ro
    ports:
      # For the agent over Tailscale. Bind to the server's Tailscale IP to keep it off the internet,
      # e.g. VITRINE_BIND=100.101.102.103
      - "${VITRINE_BIND:-0.0.0.0}:${VITRINE_TAILSCALE_PORT:-8080}:80"
    depends_on: [web]
    networks: [internal, proxy]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: vitrine
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - vitrine-db:/var/lib/postgresql/data
    networks: [internal]

  redis:
    # Needed: Celery queues, and the shared cache that carries guests' live control
    # (what is on screen, who has control, command results) between web and the agent socket.
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    networks: [internal]

volumes:
  vitrine-data:
  vitrine-db:

networks:
  internal:
  proxy:
    # Your Nginx Proxy Manager network; set VITRINE_PROXY_NETWORK if it isn't called "proxy".
    external: true
    name: ${VITRINE_PROXY_NETWORK:-proxy}

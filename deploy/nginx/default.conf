# Sits in front of Django: serves static files, hands protected media to clients
# (X-Accel-Redirect, with Range support for resumable agent downloads) and
# passes WebSockets through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # tus sends 8 MB chunks; leave headroom.
    client_max_body_size 64m;
    proxy_request_buffering off;

    location /static/ {
        alias /data/static/;
        expires 7d;
    }

    location /protected/ {
        internal;
        alias /data/media/;
        add_header Accept-Ranges bytes;
    }

    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }
}
